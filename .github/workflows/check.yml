name: check

on:
  pull_request:
    paths:
      - 'seed/**'
      - 'public/data/**'
      - 'tools/**'
  push:
    branches: [main]
    paths:
      - 'seed/**'
      - 'tools/**'

permissions:
  contents: write

jobs:
  bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - name: 题库校验（红灯即违规）
        run: python tools/check.py

      # PR：贡献者须本地重建并一并提交产物（保持可复现）
      - name: 产物可复现校验（PR）
        if: github.event_name == 'pull_request'
        run: |
          python tools/build_bank.py --out /tmp/puzzles.json
          diff <(python -c "import json;print(json.dumps(json.load(open('/tmp/puzzles.json')),ensure_ascii=False,sort_keys=True))") \
               <(python -c "import json;print(json.dumps(json.load(open('public/data/puzzles.json')),ensure_ascii=False,sort_keys=True))")

      # 主干：只提交 seed 也可以，CI 重建产物并自动提交（本地无需装 Python）
      - name: 重建题库产物（主干）
        if: github.event_name == 'push'
        run: |
          python tools/build_bank.py
          if [[ -n "$(git status --porcelain public/data/puzzles.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/puzzles.json
            git commit -m "重建题库产物 [skip ci]"
            git push
          else
            echo "产物与提交一致，无需重建"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
